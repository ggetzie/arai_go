{{define "content"}}
<p>
    Click on a link below to view questions from that day
</p>

<ul class="list-group m-auto text-center" style="max-width: 400px;">
    {{range .Dates}}
    <li class="list-group-item">
        <a href="/{{ymd .}}">{{isodate .}}</a>
    </li>
    {{end}}
</ul>

<div class="mt-3">
    {{template "pagination" .Page}}
</div>
{{end}}
